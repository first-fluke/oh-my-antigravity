# oh-my-agent — project config
#
# The single user-owned file: `oma update` preserves it byte for byte and only
# appends top-level keys new releases introduce. Every other file under
# `.agents/` is replaced wholesale on update, so this is the only place edits
# survive.
#
# Every key is optional except `language` and `model_preset`. Commented-out
# blocks below show a key's default — uncomment only what you want to change.
#
# Contents
#   1. Global preferences        language, date/time, telemetry
#   2. Model selection           model_preset, default_cli, agents, models, custom_presets
#   3. pi transport runtime      vendors.pi
#   4. Agent spawn budget        session.quota_cap
#   5. Memory garbage collection memory.gc
#   6. Serena MCP transport      serena
#   7. Serena memory reaper      serena_reaper
#   8. Browser DevTools MCP      mcp.devtools_browsers
#   9. Documentation drift       docs
#  10. SCM & commit rules        scm
#  11. Skill overrides           video, image, voice, hwp, pdf, scholar, diagram, market
#  12. Refactor guard hook       refactor_guard
#
# Full schema: web/docs/guide/per-agent-models.md

# ─────────────────────────────────────────────────────────────────────────────
# 1. Global preferences
# ─────────────────────────────────────────────────────────────────────────────

# Response language (ko, en, ja, zh, ...)
language: en

# Translation voice preference for oma-translation skill.
#   formal      — technical writer / reporter style, complete sentences, no fragments,
#                 strict 합니다체 / です・ます (best for legal, official docs)
#   balanced    — content-type-based persona routing (default)
#   interpreter — interpreter mindset across all content types: punchy, audience-first,
#                 spoken cadence, fragments allowed when natural, drops formal padding
# Affects persona resolution in `.agents/skills/oma-translation/SKILL.md` Stage 2.5.
translation_voice: balanced

# Date / time
date_format: ISO
timezone: Asia/Seoul

# Auto-update the oh-my-agent CLI in the background when outdated.
# Disable per-shell with OMA_SKIP_VERSION_CHECK=1.
auto_update_cli: true

# Vendor telemetry opt-in. Applied at `oma install` / `oma update` / `oma doctor`.
#   false (default) — oh-my-agent writes the following opt-outs:
#       • Claude : env.DISABLE_TELEMETRY = "1" in .claude/settings.json
#                  (note: this also disables Claude Code Remote Control
#                  v2.1.51+, since the RC eligibility check fails when
#                  DISABLE_TELEMETRY is set)
#       • Gemini : privacy.usageStatisticsEnabled = false in .gemini/settings.json
#       • Qwen   : privacy.usageStatisticsEnabled = false in .qwen/settings.json
#       • Codex  : analytics.enabled = false, feedback.enabled = false in
#                  .codex/config.toml
#   true            — the keys above are stripped on next install/update so each
#                     vendor's default telemetry path runs (and Claude Code
#                     Remote Control becomes eligible).
telemetry: false

# ─────────────────────────────────────────────────────────────────────────────
# 2. Model selection
# ─────────────────────────────────────────────────────────────────────────────
#
# With auto, explicit agents overrides win; otherwise the runtime selects the
# vendor and its native settings select the model. Unknown runtimes use default_cli.
# Resolution order with a fixed preset:
#   1. agents.<id>            — explicit per-agent override
#   2. model_preset entry     — built-in or custom_presets[model_preset]
#   3. preset.orchestrator    — fallback when an agent is missing from the preset
#   4. default_cli            — vendor-only fallback when none of the above resolve

# auto follows the current runtime's agent/model settings without pinning a model.
# Explicit agents overrides still win; unknown runtimes use default_cli.
# Fixed presets: antigravity | claude | codex | qwen | cursor | kiro | mixed
# (custom_presets entries are also valid)
model_preset: auto

# Fallback CLI vendor for `oma agent spawn`, used only when steps 1-3 above
# resolve nothing. This is the only place it can be set — cli-config.yaml's
# `active_vendor:` is no longer read. Omit for "claude".
# default_cli: claude

# Per-agent override (optional) — shallow-merged on top of the preset entry.
# Agent ids: orchestrator, architecture, qa, pm, backend, frontend, mobile,
#            db, debug, refactor, docs, tf-infra, explore, eval
# Each AgentSpec accepts:
#   model:    "<owner>/<slug>"  required.  Slugs follow OpenRouter convention
#             (https://openrouter.ai/models). Only models whose owning vendor
#             ships a forkable CLI (antigravity, claude, codex, qwen) are usable —
#             API-only entries (api_only: true) are skipped. Custom slugs go
#             in `models:` below.
#   effort:   none | low | medium | high | xhigh   (ignored for cli-session models like Claude)
#   thinking: true | false                          (vendor-dependent)
#   memory:   user | project | local                (per-agent memory tier)
#
# `eval` below pins skill-eval dispatch (`oma skill eval --live`) to claude:
# antigravity external dispatch is unreliable in this environment (prompts do
# not reach the model; see spawn artifact guard notes). Add your own entries
# alongside it, e.g.
#   backend: { model: openai/gpt-5.5, effort: high }
agents:
  eval:
    model: anthropic/claude-sonnet-4-6

# Inline custom model slugs (optional) — the home for any slug not in the
# built-in registry. `cli_model` must be the exact id the CLI itself accepts:
# for antigravity that is an `agy models` display name, not a slug
# (`gemini-3.6-flash` is rejected).
#
# Replaces `.agents/config/models.yaml`, which `oma uninstall` deletes along
# with the rest of `.agents/config/`. That file is no longer read; `oma update`
# folds its entries in here automatically (migration 022).
# Example:
# models:
#   my-fast:
#     cli: antigravity
#     cli_model: "Gemini 3.6 Flash (Medium)"
#     supports:
#       native_dispatch_from: [antigravity]

# User-defined presets (optional). Use `extends:` to partially inherit a built-in.
# Example:
# custom_presets:
#   my-team:
#     extends: claude
#     description: "Team A — sonnet base, codex backend"
#     agent_defaults:
#       backend: { model: openai/gpt-5.5, effort: high }

# ─────────────────────────────────────────────────────────────────────────────
# 3. pi (Earendil) transport runtime
# ─────────────────────────────────────────────────────────────────────────────
#
# pi is a multi-provider proxy runtime. Dispatch any agent through it with
# `oma agent spawn <agent> "<prompt>" <session> --vendor pi`. The per-agent model
# resolved from `model_preset` / `agents:` is translated to pi's `--model`
# (provider/id slug) and effort to pi's `--thinking` level — so per-subagent
# models work on pi too. pi only runs real-provider models (anthropic, openai,
# google); CLI-proprietary presets (cursor/kiro/qwen/antigravity) are rejected.
#
# The `vendors.pi` block below is the FALLBACK model path, used only when no
# resolved plan applies (e.g. no model_preset). Normal runs do not need it.
#
# vendors:
#   pi:
#     command: pi
#     prompt_flag: "-p"
#     model_flag: "--model"
#     default_model: anthropic/claude-sonnet-4-6
#     thinking_flag: "--thinking"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Agent spawn budget
# ─────────────────────────────────────────────────────────────────────────────
#
# When set, `oma agent spawn` records token usage per agent and blocks the
# next spawn once any cap is exceeded. Records persist to
# .agents/state/memories/session-cost-{sessionId}.md. Omit to disable.
#
# All keys optional. Omitting a key leaves that dimension uncapped.
# Schema source: cli/io/session-cost.ts (loadQuotaCap / normalizeQuotaCap).
#
# session:
#   quota_cap:
#     tokens: 2000000          # total token budget across all vendors
#     spawn_count: 30          # max agent spawns per session
#     per_vendor:              # per-vendor token budgets
#       claude: 1500000
#       codex: 500000

# ─────────────────────────────────────────────────────────────────────────────
# 5. Memory garbage collection (`oma memory gc` defaults)
# ─────────────────────────────────────────────────────────────────────────────
#
# Tunes the project-local memory sweep. CLI flags (--keep / --max-age-days)
# override these; these override the built-in defaults. Schema source:
# cli/commands/memory/memory/gc.ts (loadMemoryGcConfig).
#
# memory:
#   gc:
#     keep_sessions: 100   # L1 .agents/state/sessions retained, most-recent (default 100)
#     max_age_days: 50     # Serena run artifacts older than N days pruned; 0 disables (default 50)

# ─────────────────────────────────────────────────────────────────────────────
# 6. Serena MCP transport
# ─────────────────────────────────────────────────────────────────────────────
#
# Each vendor's serena MCP entry is regenerated by `oma link`.
#
# Default `bridge` — the entry runs `oma bridge`, a small stdio proxy onto one
# shared serena HTTP server per (project, context), started on first use. Every
# agent session on a repo then shares a single language-server stack instead of
# spawning its own, so opening a third session costs almost nothing. Nothing to
# start or configure: the first session brings the server up, later ones reuse
# it, and one with no sessions left for 10 minutes is shut down again.
#
# If the shared server cannot be reached for any reason, the proxy falls back to
# a session-local stdio serena — the worst case is the old behaviour, never a
# session without code intelligence.
#
# `mode: stdio` opts out entirely, giving every session its own serena process.
#
# `auto_update` is opt-out (default true): `oma update` runs
# `uv tool upgrade serena-agent --prerelease=allow` after vendor reconcile
# unless set to false. Failures (uv missing, network) are warned-only — the
# previously installed serena keeps working.
#
# serena:
#   mode: stdio                     # opt out of the shared server
#   auto_update: false              # skip serena-agent upgrade on `oma update`
#
# Answer-size default lives in ~/.serena/serena_config.yml (not here):
#   default_max_tool_answer_chars: 150000
# `oma install` / `oma update` raise a missing or too-low value (≥50k floor)
# so broad search_for_pattern hits are not rejected. Per-call max_answer_chars
# still overrides this — agents should omit it unless they need a hard cap.

# ─────────────────────────────────────────────────────────────────────────────
# 7. Serena memory reaper
# ─────────────────────────────────────────────────────────────────────────────
#
# Serena spawns a language-server stack (tsserver, pyright, …) per open project
# and keeps it warm for the whole session. With several projects open this adds
# up (~300 MB each). The reaper kills idle LSP children; Serena self-heals and
# respawns them on the next tool call (no restart needed).
#
# On-demand:   `oma serena reap --dry-run`   (preview, never kills)
#              `oma serena reap`              (interactive — always runs)
# Periodic:    `oma serena reaper enable`     (installs a 5-min scheduled task)
#              `oma serena reaper disable`
# Diagnostics: shown in `oma doctor` (per-root KEEP/REAP + signal source)
#
# `enabled` gates ONLY the automatic/scheduled (`--quiet`) path — opt-in. An
# interactive `oma serena reap` always runs regardless. Defaults shown below.
#
# serena_reaper:
#   enabled: false        # opt-in: scheduled task no-ops until set true
#   policy: lru           # lru | idle
#   keepWarm: 2           # LRU: keep this many most-recently-active projects warm
#   idleMinutes: 10       # idle policy threshold / LRU secondary floor
#   graceSeconds: 90      # in-flight protection; SIGTERM→SIGKILL window

# ─────────────────────────────────────────────────────────────────────────────
# 8. Browser DevTools MCP
# ─────────────────────────────────────────────────────────────────────────────
#
# A browser DevTools MCP server is only useful while an agent is actually
# driving a browser, but it is paid for continuously: chrome-devtools-mcp costs
# three processes per agent session (`npm exec` → server → telemetry watchdog),
# and every concurrent session spawns its own set.
#
# Fresh installs offer multiple browser MCPs with Aside selected by default.
# Use `oma update mcp` to change the selection; missing Aside is installed automatically.
#
# Leaving the key unset means "don't touch what's already configured" — `oma
# update` only rewrites the browser entries when `devtools_browsers` is present,
# so an existing setup is never silently stripped. Set it to `[]` to remove them.
#
# mcp:
#   devtools_browsers: [aside]      # aside | chrome | firefox; multiple or []

# ─────────────────────────────────────────────────────────────────────────────
# 9. Documentation drift detection (oma-docs)
# ─────────────────────────────────────────────────────────────────────────────

docs:
  # When true, runs `oma docs verify --json` at the end of /scm, /work, /ultrawork.
  # Warn-only — never blocks workflow completion. Default: false (opt-in).
  # See `.agents/skills/oma-docs/SKILL.md` for full behavior.
  auto_verify: false

  # When true (default), URL link checking is delegated to `lychee` running
  # in the background; results land in docs/generated/url-drift.json.
  # If `lychee` is missing, `oma docs verify` prints an install hint and
  # skips URL checking. Set to false to silence that hint and disable URL
  # checks entirely (e.g., when you run lychee separately from CI).
  # Install: `brew install lychee` (macOS) or see
  # https://github.com/lycheeverse/lychee#installation for other platforms.
  check_urls: true

  # Glob patterns (repo-root-relative, POSIX) for markdown trees `oma docs
  # verify` must NOT scan. Use for committed-but-non-prose trees that
  # legitimately contain unresolvable refs. Gitignored paths are skipped
  # automatically and need no entry here. Matched with minimatch (dot:true).
  exclude:
    - "benchmarks/**" # agent run artifacts referencing benchmarked projects
    - "web/i18n/**" # translation mirrors — validated by `oma docs i18n` instead

# ─────────────────────────────────────────────────────────────────────────────
# 10. SCM & commit rules (oma-scm)
# ─────────────────────────────────────────────────────────────────────────────
scm:
  conventional_commits: true
  branching_strategy: github-flow
  require_pr_for_default_branch: true
  co_author:
    enabled: true
    name: "First Fluke"
    email: "our.first.fluke@gmail.com"
    # Install a commit-msg hook that rejects any Co-authored-by address not on
    # the allowlist (.githooks/co-authors.allow plus the email above). Agents
    # type this trailer as literal text, and GitHub credits whoever owns a
    # mistyped address as a contributor — permanently, since refs/pull/* keeps
    # the commit reachable. Set false to opt out of oma managing git hooks.
    enforce_hook: true
  forbidden_patterns:
    - "*.env"
    - "*.env.*"
    - "credentials.json"
    - "secrets.yaml"
    - "*.pem"
    - "*.key"
    - ".env.local"
    - "*.p12"
    - "*.pfx"
    - "id_rsa*"
    - "id_ed25519*"
    - ".npmrc"
    - "service-account*.json"
    - "*.keystore"
    - "*.jks"
    - "*.tfvars"
    - "*.tfstate"
    - "*.tfstate.*"
    - ".netrc"
    - ".pypirc"
  allowed_exceptions:
    - "*.example"
    - "*.sample"
    - "*.template"

# ─────────────────────────────────────────────────────────────────────────────
# 11. Skill overrides
# ─────────────────────────────────────────────────────────────────────────────
#
# Eight skills read their user settings from here. Each section is OPTIONAL and
# SPARSE: write only the keys you want to change, because an absent key means
# "use the shipped default" — so defaults keep improving with each release
# instead of freezing the day you copied them. The values shown commented out
# below ARE the current defaults; uncomment a line only to change it.
#
# These replace the per-skill `.agents/skills/*/config/*.yaml` files, which
# `oma update` overwrites wholesale — anything set there is lost on the next
# update. The CLI no longer reads those files at all; `oma update` moves your
# changed keys up here automatically (migration 022).
#
# Precedence: shipped defaults < this file < env < flags

# ── video (oma-video) ────────────────────────────────────────────────────────
# Brief → script → assets → render. Defaults: DEFAULT_VIDEO_CONFIG in
# cli/commands/video/config.ts.
# video:
#   default_output_dir: .agents/results/videos
#   default_mode: shorts            # shorts | explainer | demo
#   default_aspect: auto
#   default_locale: en
#   default_captions: tiktok
#   default_visual: auto
#   default_voice: none
#   default_music: none
#   default_compositor: remotion
#   default_timeout_sec: 600
#   yes: false                      # skip interactive confirmations
#   providers:
#     script:     { order: [agent-script] }
#     voice:      { order: [oma-voice] }
#     visual:     { order: [oma-image, pexels, pixelle] }
#     caption:    { order: [oma-captions] }
#     capture:    { order: [cap] }
#     music:      { order: [strudel] }
#     compositor: { order: [remotion, mpt] }
#     # Paid providers turn themselves on when their key is in the environment;
#     # only the variable name is configurable.
#     pexels:     { env_var: PEXELS_API_KEY }
#     pixelle:    { env_var: RUNNINGHUB_API_KEY }
#   cost:
#     guardrail_usd: 0.20
#   limits:
#     max_duration_sec: 180
#     max_scenes: 40
#   naming:
#     single_folder_pattern: "{timestamp}-{shortid}-{mode}"
#   # Always-latest Remotion. oma ships no composition code: `oma video compose`
#   # scaffolds <runDir>/remotion/ on the latest npm remotion (cache
#   # ~/.cache/oma-video/remotion/<ver>/) with remotion-dev/skills at HEAD, and
#   # the agent authors the composition per run. Latest checks are throttled by
#   # check_interval_min; `oma update` / `oma video doctor --upgrade` force one.
#   remotion:
#     check_interval_min: 60        # 0 = check on every compose

# ── image (oma-image) ────────────────────────────────────────────────────────
# Image generation across codex / antigravity / pollinations. Defaults:
# DEFAULTS in cli/commands/image/config.ts.
# image:
#   default_output_dir: .agents/results/images
#   default_vendor: auto            # auto | codex | antigravity | pollinations
#   default_size: 1024x1024
#   default_quality: auto
#   default_count: 1
#   default_timeout_sec: 180
#   vendors:
#     pollinations: { enabled: true, model: flux }
#   cost_guardrail:
#     estimate_threshold_usd: 0.20
#     # Override only the prices you disagree with — untouched entries keep
#     # tracking vendor pricing changes.
#     per_image_usd:
#       codex:
#         gpt-image-2: { high: 0.04 }
#   compare:
#     folder_pattern: "{timestamp}-{shortid}-compare"
#     manifest: true
#   naming:
#     single_folder_pattern: "{timestamp}-{shortid}"

# ── voice (oma-voice) ────────────────────────────────────────────────────────
# Local TTS / STT via the Voicebox MCP server. Profile names come from
# `voicebox_list_profiles`; both ship as null and must be set per machine, so
# this is the section most worth filling in.
# voice:
#   notification_profile: null
#   asset_profile: null
#   output_dir: .agents/results/voice
#   auto_notify_after_sec: 60       # null disables auto-notification
#   max_tts_chars: 5000
#   max_stt_minutes: 30

# ── hwp (oma-hwp) ────────────────────────────────────────────────────────────
# HWP / HWPX / HWPML → Markdown via kordoc. The advertised input formats stay
# in the skill config; they are scope, not preference.
# hwp:
#   format: markdown                # markdown | json | chunks
#   version:
#     channel: latest               # latest | pinned
#     pinned: "4.7.3"
#   output:
#     default_location: same_dir    # same_dir | cwd

# ── pdf (oma-pdf) ────────────────────────────────────────────────────────────
# PDF → Markdown via opendataloader-pdf.
# pdf:
#   format: markdown
#   image_output: "off"             # off | embedded | external
#   image_format: png               # png | jpeg
#   use_struct_tree: false
#   ocr:
#     enabled: false
#     languages: "en"               # comma-separated, e.g. "ko,en"
#     hybrid_port: 5002
#   output:
#     default_location: same_dir    # same_dir | cwd
#     overwrite: false

# ── scholar (oma-scholar) ────────────────────────────────────────────────────
# Knows sidecar research companion. Only the endpoint host is a preference —
# point it at a self-hosted knows. Endpoint paths, timeouts, id prefixes and
# lint rules are protocol shape and stay in the skill config.
# scholar:
#   base_url: https://knows.academy

# ── diagram (oma-architecture / oma-explanation) ─────────────────────────────
# Which engine renders architecture / sequence / data-flow diagrams.
#   auto     — archify (tt-a1i/archify) whenever it can be resolved, else Mermaid
#   archify  — require archify; `oma diagram resolve` exits 1 when unresolvable
#   mermaid  — never call archify
# archify is ALWAYS the latest release: oma keeps its own copy under
# ~/.cache/oma-diagram/archify/<tag>/ and re-checks GitHub before use (throttled
# by check_interval_min; a failed check falls back to the cached copy, never to
# Mermaid). Resolution order: archify.path → ARCHIFY_HOME → managed latest →
# user-installed skill dirs (.agents/.claude/.codex/.cursor/.qwen/.kiro/skills).
# Mermaid stays the text SSOT inside ADR / recommendation Markdown either way;
# archify adds a sibling `<name>.archify.json` + `<name>.archify.html`.
# Inspect with `oma diagram resolve --json`; force a refresh with
# `oma diagram update`. Defaults: DEFAULT_DIAGRAM_CONFIG in
# cli/commands/diagram/resolve.ts.
# diagram:
#   engine: auto
#   explain_sidecar: false          # /explain also writes an archify sidecar
#   archify:
#     managed: true                 # false = only use path / ARCHIFY_HOME / skill dirs
#     channel: stable               # stable (latest GitHub Release) | main (HEAD)
#     check_interval_min: 60        # minutes between remote checks; 0 = every call
#     path: null                    # explicit install dir (pin; disables auto-latest)
#     quality: showcase             # showcase | standard (validate/deliver --quality)
#     open: false                   # pass --open to deliver for a local preview

# ── market (oma-market) ──────────────────────────────────────────────────────
# Community-signal research runs on the upstream mvanhorn/last30days engine.
# oma keeps an ALWAYS-LATEST managed copy under ~/.cache/oma-market/last30days/
# <tag>/ and re-checks GitHub Releases before use (throttled; cached copy on
# network failure). Resolution order: market.path → LAST30DAYS_HOME → managed
# latest → user-installed skill dirs / Claude plugin cache. Engine config and
# API keys live in ~/.config/last30days/ (owned by the upstream setup wizard).
# Inspect with `oma market resolve --json`; force a refresh with
# `oma market update`. Defaults: DEFAULT_MARKET_CONFIG in
# cli/commands/market/resolve.ts.
# market:
#   managed: true                   # false = only use path / LAST30DAYS_HOME / skill dirs
#   channel: stable                 # stable (latest GitHub Release) | main (HEAD)
#   check_interval_min: 60          # minutes between remote checks; 0 = every call
#   path: null                      # explicit engine dir (pin; disables auto-latest)
#   python: null                    # Python ≥ 3.12 interpreter; else LAST30DAYS_PYTHON,
#                                   # PATH ladder (python3.14…python3), then `uv python find`
#   save_dir: .agents/results/market/raw   # engine --save-dir default

# ─────────────────────────────────────────────────────────────────────────────
# 12. Refactor guard hook (refactor-guard)
# ─────────────────────────────────────────────────────────────────────────────
#
# Two-phase hook: PostToolUse silently RECORDS code files touched by
# Edit/Write tools (never interrupts mid-turn); when the turn tries to end,
# the Stop hook re-counts recorded files and blocks the stop while any
# exceeds `max_lines`, instructing the agent to dispatch the
# `refactor-engineer` subagent first. Bounded per file (2 stop blocks) so a
# turn can always terminate. Code-file extensions only (generated /
# dependency trees are skipped). Wired for every hook vendor: claude / codex /
# qwen / commandcode / kimi / cursor (afterFileEdit) / grok / antigravity /
# kiro. kiro's Stop output is ignored by its host, so there the enforcer
# directly spawns `oma agent spawn refactor-engineer` (detached) instead.
# Handler: `.agents/hooks/core/refactor-guard.ts`.
#
# Opt-in — forced refactoring is off by default. `max_lines` is the per-file
# line budget. Note the key is `enabled`, not `enable`.
# refactor_guard:
#   enabled: false
#   max_lines: 500
